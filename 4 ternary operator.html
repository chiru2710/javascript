<!--               TERINARY OPERATOR          -->              
<!--SYNTAX:condition=TRUE?"True statement":"default statement"-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ternary Operator</title>
</head>
<body>
    <h1>TERNARY OPERATOR</h1>
    <script>
        var a = 5;
        var b = 6;
        // Using ternary operator to check the condition and log the result
        var result = (a + b == 11) ? `The sum of a and b is ${a + b}` : "The sum is not equal to 11";
        console.log(result); 
    </script>
</body>
</html>
