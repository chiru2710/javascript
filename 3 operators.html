<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Operators</title>
</head>
<body>
  <h1 style="background-color: palevioletred; color: black; text-align: center;">
    JavaScript Operators
  </h1>
  <center>
    <script>
      let a = 10, b = 5;

      // 1. Arithmetic Operators
      document.write("<h2>Arithmetic Operators</h2>");
      document.write("a = " + a + ", b = " + b + "<br>");
      document.write("Addition (a + b) = " + (a + b) + "<br>");
      document.write("Subtraction (a - b) = " + (a - b) + "<br>");
      document.write("Multiplication (a * b) = " + (a * b) + "<br>");
      document.write("Division (a / b) = " + (a / b) + "<br>");
      document.write("Modulus (a % b) = " + (a % b) + "<br>");
      document.write("Exponentiation (a ** b) = " + (a ** b) + "<br>");
      document.write("Increment (++a) = " + (++a) + "<br>");
      document.write("Decrement (--b) = " + (--b) + "<br><br>");

      // 2. Assignment Operators
      document.write("<h2>Assignment Operators</h2>");
      let x = 20;
      document.write("x = " + x + "<br>");
      x += 5; document.write("x += 5 → " + x + "<br>");
      x -= 3; document.write("x -= 3 → " + x + "<br>");
      x *= 2; document.write("x *= 2 → " + x + "<br>");
      x /= 4; document.write("x /= 4 → " + x + "<br>");
      x %= 3; document.write("x %= 3 → " + x + "<br>");
      x **= 2; document.write("x **= 2 → " + x + "<br><br>");

      // 3. Comparison Operators
      document.write("<h2>Comparison Operators</h2>");
      let p = 10, q = "10";
      document.write("p == q → " + (p == q) + "<br>");
      document.write("p === q → " + (p === q) + "<br>");
      document.write("p != q → " + (p != q) + "<br>");
      document.write("p !== q → " + (p !== q) + "<br>");
      document.write("p > b → " + (p > b) + "<br>");
      document.write("p < b → " + (p < b) + "<br>");
      document.write("p >= b → " + (p >= b) + "<br>");
      document.write("p <= b → " + (p <= b) + "<br><br>");

      // 4. Logical Operators
      document.write("<h2>Logical Operators</h2>");
      let m = true, n = false;
      document.write("m && n → " + (m && n) + "<br>");
      document.write("m || n → " + (m || n) + "<br>");
      document.write("!m → " + (!m) + "<br><br>");

      // 5. Bitwise Operators
      document.write("<h2>Bitwise Operators</h2>");
      let u = 5, v = 3;
      document.write("u & v (AND) → " + (u & v) + "<br>");
      document.write("u | v (OR) → " + (u | v) + "<br>");
      document.write("u ^ v (XOR) → " + (u ^ v) + "<br>");
      document.write("~u (NOT) → " + (~u) + "<br>");
      document.write("u << 1 (Left Shift) → " + (u << 1) + "<br>");
      document.write("u >> 1 (Right Shift) → " + (u >> 1) + "<br>");
      document.write("u >>> 1 (Unsigned Right Shift) → " + (u >>> 1) + "<br><br>");

      // 6. Ternary Operator
      document.write("<h2>Ternary Operator</h2>");
      let age = 18;
      let result = (age >= 18) ? "Adult" : "Minor";
      document.write("Age = " + age + " → " + result + "<br><br>");

      // 7. Type Operators
      document.write("<h2>Type Operators</h2>");
      document.write("typeof 100 → " + typeof 100 + "<br>");
      document.write("typeof 'hello' → " + typeof 'hello' + "<br>");
      document.write("typeof true → " + typeof true + "<br>");
      document.write("typeof undefined → " + typeof undefined + "<br>");
      document.write("typeof null → " + typeof null + "<br>");
      document.write("[] instanceof Array → " + ([] instanceof Array) + "<br>");
      document.write("({}) instanceof Object → " + ({} instanceof Object) + "<br>");
    </script>
  </center>
</body>
</html>
