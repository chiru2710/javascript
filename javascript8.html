<!-- TYPE CONVERSION-->
 <!-- Type conversion means converting on data typpe to another data type-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Conversion</title>
</head>
<body>
    <script>
        var b=10;
       a= typeof(b);
       document.write(a + "<br><br>")
       c=String(b)
       document.write(c + "<br><br>")
       a1= typeof(c);
       document.write(a1)
    </script>
</body>
</html>
