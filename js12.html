</head>
<body>
    <h1><center>
        Return Function
    </center></h1>
    <script>
        var a=function cricket(){
            document.write("cricket is an Bat and Ball game played by two teams and each team consists of 11 pllayers" + "<br><br>")
           
        }

        var b=function(){
            document.write("Kabaddi is game played by two teams in each have 7 plaers"+"<br><br>")
        }
        b();
        function games(a,b){
           return document.write("I like " + a + " and " + b)
        }

    </script>
