<!DOCTYPE html>
<html>
<head>
    <title>Get Element By ID Example</title>
</head>
<body>
    <h1 id="myHeading">Hello, World!</h1>
    <button onclick="changeText()">Click Me</button>

    <script>
        function changeText() {
            var heading = document.getElementById("myHeading");
            heading.innerHTML = "You clicked the button!";
        }
    </script>
</body>
</html>
